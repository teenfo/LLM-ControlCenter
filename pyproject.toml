[project]
name = "llm-controlcenter"
version = "0.1.0"
description = "설치형 LLM 클러스터 관제 솔루션 — 다중 백엔드 라우팅·테넌시·프롬프트 거버넌스"
requires-python = ">=3.11"

# 의존성을 얇게 유지하는 것이 이 시스템의 이식성을 만든다.
# cryptography 는 5번째로 의식적으로 추가했다 — 암호를 직접 구현하는 쪽이 훨씬 나쁘다.
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# 클라우드 프로바이더는 선택적이다. 로컬 노드만 쓰는 설치처가 클라우드 SDK 를
# 강제로 받을 이유가 없고, 에어갭 설치에서는 아예 설치되지 않는다.
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
