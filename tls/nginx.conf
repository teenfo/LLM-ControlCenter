# TLS 종단 + 관리 면 노출 축소.
#
# **이 파일이 docs/topology.md §2 "제품이 강제하는 것" 열의 근거다.**
# 표가 프록시의 통제를 주장하면서 그 설정을 번들에 안 담으면, 그 통제는 설치처 숙제인데
# 제품의 보증처럼 읽힌다 — 그러면 아무도 그 숙제를 안 한다. 그래서 여기 있다.
#
#   docker compose --profile tls up -d
#
# 인증서는 이 디렉터리에 fullchain.pem / privkey.pem 으로 넣는다.
# 컴포즈가 ./tls 를 /etc/nginx/certs 로, 이 파일을 conf.d/default.conf 로 마운트한다.

upstream controlcenter {
    # 다중 워커 구성(docs/deployment.md §3.3)이면 여기에 워커를 나열한다.
    # 스케줄러를 켠 프로세스도 API 를 서빙하므로 함께 넣어도 된다.
    server controlcenter:8610;
    # server controlcenter-2:8610;
    # server controlcenter-3:8610;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    # 평문으로 온 것은 토큰이 이미 평문으로 지나간 뒤다. 리다이렉트는 그것을 되돌리지
    # 못하지만, 다음 요청부터는 막는다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 프롬프트가 200KB 까지 온다(역할의 max_prompt_chars). 앱이 2MB 에서 자르므로
    # 프록시가 먼저 자르면 앱의 오류 계약 대신 nginx 의 413 이 나간다.
    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ── 플랫폼 관리 면 — 차단 ────────────────────────────────────────────────
    #
    # 테넌트 생성·정지, 노드 등록, 모델 승인, 전역 관제. 설치처 **내부**에서만 쓴다.
    #
    # 404 이지 403 이 아니다. 403 은 "여기 뭔가 있다" 를 알려 준다.
    #
    # 이것은 인증의 대체가 아니라 **노출 축소**다. 앱의 역할 검사는 프록시가 없어도
    # 그대로 돈다 — 이 블록은 공개망에 드러나는 표면을 줄이는 두 번째 겹이다.
    location /v1/platform/ {
        return 404;
    }

    # ── 테넌트 관리 면 — 통과시킨다 ──────────────────────────────────────────
    #
    # `/v1/admin/*` 은 이름이 admin 이라 막고 싶어지지만 **테넌트 관리자의 API 다.**
    # 막으면 테넌트가 자기 서비스 토큰도 못 만든다. 원격에서 닿아야 하는 면이다.
    # (이 주석이 없으면 다음 사람이 "admin 인데 왜 안 막았지" 하고 막는다.)

    location / {
        proxy_pass http://controlcenter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # `wait` 파라미터가 붙은 제출은 잡이 끝날 때까지 열려 있다. 역할 timeout 상한이
        # 3600초라 프록시가 먼저 끊으면 소비자는 잡이 도는 중에 502 를 받는다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    3660s;
        proxy_send_timeout    3660s;
        proxy_buffering       off;
    }

    # 컨테이너 헬스체크·로드밸런서용. 인증이 없으므로 접근 로그에서 뺀다 —
    # 초당 몇 건씩 남으면 진짜 요청이 안 보인다.
    location = /healthz {
        proxy_pass http://controlcenter;
        proxy_set_header Host $host;
        access_log off;
    }
}
