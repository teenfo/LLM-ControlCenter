# LLM ControlCenter — 컨트롤 플레인 호스트 1대.
#
#   docker compose up -d
#   docker compose logs controlcenter    # 최초 기동 값이 여기 한 번 찍힌다
#
# **컨트롤 플레인은 1대다.** 노드 에이전트도, 별도 웹서버도, 메시지 브로커도,
# 캐시 서버도 없다 — 노드는 엔드포인트 등록형이고, 관제 UI 는 앱이 직접 서빙하고,
# 잡 큐는 DB 테이블이고, 추론은 전부 LLM 노드에서 돈다.
#
# 별도 위치가 필요한 것 둘: ① 백업 저장소 ② 마스터 KEK.
# 둘을 이 호스트에 함께 두면 1대 구성의 단순함이 그대로 단일 실패점이 되고,
# 백업이 유출되면 암호문도 함께 열린다.

name: llm-controlcenter

services:
  controlcenter:
    build: .
    image: llm-controlcenter:${LCC_VERSION:-0.1.0}
    restart: unless-stopped
    # 데모 노트북에서 전원만 켜면 뜨게 하려면 restart 정책이 필요하다.
    ports:
      - "${LCC_BIND:-127.0.0.1}:8610:8610"
    volumes:
      - lcc-data:/data
      # KEK 는 **호스트의 다른 경로**에서 마운트한다. 백업 대상 볼륨과 같은 곳에
      # 두면 백업 유출이 곧 원문 유출이다.
      - ${LCC_KEYS_PATH:-./keys}:/keys
      # 설정은 읽기 전용. 런타임 변경은 관제 UI 를 통해 DB 로 간다 —
      # 제품에서 "YAML 편집 후 재기동" 은 성립하지 않는다.
      - ./config:/app/config:ro
    environment:
      # 원문 암호화 보관. 비워 두면 마스킹본만 저장된다(fail-closed).
      LCC_PROMPT_KEY: "${LCC_PROMPT_KEY:-}"
      # 에어갭 모드 — 클라우드 티어를 자동 비활성화하고 UI 에 표시한다.
      LCC_AIRGAP: "${LCC_AIRGAP:-}"
      # 알림. 없으면 알림이 안 나가고, 그 사실을 관제 UI 가 표시한다.
      LCC_NOTIFY_WEBHOOK: "${LCC_NOTIFY_WEBHOOK:-}"
      LCC_SMTP_HOST: "${LCC_SMTP_HOST:-}"
      LCC_SMTP_PORT: "${LCC_SMTP_PORT:-}"
      LCC_SMTP_FROM: "${LCC_SMTP_FROM:-}"
      LCC_SMTP_TO: "${LCC_SMTP_TO:-}"
      LCC_SMTP_USER: "${LCC_SMTP_USER:-}"
      LCC_SMTP_PASSWORD: "${LCC_SMTP_PASSWORD:-}"
      LCC_SMTP_TLS: "${LCC_SMTP_TLS:-}"
      # 클라우드 프로바이더를 노드로 등록할 때만 필요하다.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8610/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      # 구조화 JSON 로그가 stdout 으로 나간다. 설치처의 수집기가 그대로 가져간다.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # TLS 종단. 기본은 꺼져 있다 — 인증서를 넣기 전에 켜면 그냥 안 뜬다.
  #
  #   docker compose --profile tls up -d
  #
  # 인증서를 ./tls/ 에 넣고 nginx.conf 를 함께 둔다.
  proxy:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - controlcenter
    ports:
      - "443:443"
    volumes:
      - ./tls:/etc/nginx/certs:ro
      - ./tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  lcc-data:
