# 노드 시드 — 부트스트랩 때 DB로 적재되고, 그 이후로는 DB가 권위다.
#
# 노드 등록·수정은 관제 UI(엔드포인트 등록형)에서 한다. 이 파일을 고쳐도 이미 부트스트랩된
# 설치에는 반영되지 않는다 — 제품에서 "YAML 편집 후 재기동"은 성립하지 않기 때문이다.
# 이 파일의 용도는 (1) 최초 설치 시드 (2) Demo 프로파일 (3) 설정 형태의 문서화 셋이다.
#
# data_boundary 는 선언으로만 받고 추론하지 않는다. 기본값은 external(fail-safe) —
# 안 적은 노드를 내부로 간주하면 실수가 "새는 쪽"으로 향한다.
# provider: ollama 라고 internal 인 것이 아니다. 임대 GPU 의 Ollama 는 external 이다.

mock-a:
  provider: mock
  base_url: "mock://node-a"
  data_boundary: internal
  mem_budget_gb: 24
  max_concurrent: 2
  tags: [internal, demo]
  models: ["demo-small", "demo-medium", "guard-classifier"]

mock-b:
  provider: mock
  base_url: "mock://node-b"
  data_boundary: internal
  mem_budget_gb: 16
  max_concurrent: 1
  tags: [internal, demo]
  models: ["demo-small", "guard-classifier"]

mock-cloud:
  provider: mock
  base_url: "mock://cloud"
  data_boundary: external          # 경계 밖 — 가드 통과분만 도달한다
  max_concurrent: 4
  tags: [external, demo]
  models: ["demo-cloud"]
  metered_override: true           # 데모에서 비용 경로를 보여주기 위해 과금 노드로 취급

