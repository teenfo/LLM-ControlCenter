# daily-status — schedule 트리거 예제. 매일 아침 클러스터 상태를 한 문단 한국어로 만든다.
# 규칙은 `python clients/lccp.py check examples/plugins/daily-status` 가 호스트와 같은 코드로 판정한다.

[plugin]
id = "example.daily-status"
name = "아침 상태문"
version = "0.1.0"
requires_host = ">=0.6,<0.7"
description = "매일 08:00(Asia/Seoul) 클러스터 상태를 summarize 역할로 한 문단 요약한다"

[service]
# tick 당 LLM 호출 한 번. 이 서비스의 예산·레이트리밋이 상한이다 — 예제라 소액이다.
allow_roles = ["summarize"]
rate_limit_per_min = 2
budget_usd_per_month = 1.0

[run]
kind = "external"

[trigger]
kind = "schedule"
# 분 시 일 월 요일 — 이름·@daily 는 안 받는다. 밀린 예정은 몰아서 돌지 않는다(사흘 꺼져 있었으면 한 번만).
schedule = "0 8 * * *"
timezone = "Asia/Seoul"
