# 증설·전환 트리거. 관제 UI 경고 임계값과 문서가 이 파일 하나를 함께 인용한다.
# 문서의 숫자와 코드의 임계값이 갈라지면 "손으로 관리하는 표는 반드시 어긋난다"를 그대로 반복한다.

lane_utilization_warn: 0.70          # 5분 평균 슬롯 점유율
queue_wait_p95_seconds: 30
starvation_trips_per_day: 10
node_memory_reject_rate: 0.05
single_homed_node_utilization: 0.60  # 단일 호밍 역할의 노드 포화율
cost_budget_burn_warn: 0.80          # 월 예산 소진율
db_size_gb_migrate: 50               # 이 이상이면 Postgres 전환 검토
tenant_count_scale_profile: 20

# 스캔 창 — 틱마다 (대기 잡 x 노드) 전수 검사를 막는다.
# 잘린 사실은 상태 API 에 노출한다. 조용히 자르면 "전부 검토했다"로 읽힌다.
scan_window_per_lane: 50

# 행정적 부재(노드 비활성·전부 unhealthy)로 대기하는 잡의 최대 대기 시간.
# 이 시간을 넘으면 실패시킨다. 용량 불가와 달리 즉시 실패시키지 않는 이유는
# 관리자가 노드를 5분 정비하려고 내린 것일 수 있기 때문이다.
administrative_wait_timeout_seconds: 900

# 노드 헬스 판정
health_failures_to_unhealthy: 3      # 1회 실패로 죽이지 않는다
health_successes_to_healthy: 2       # 1회 성공으로 되살리지 않는다 (플래핑 방지)
health_probe_interval_seconds: 30    # unhealthy 노드에 보내는 반열림 프로브

# 재시도
max_retries: 3                       # 최초 1회 + 재시도 3회
retry_backoff_seconds: [2, 4, 8]
