# 설치 후보 모델 큐레이션 목록.
#
# 모델 레지스트리를 스크레이핑하지 않는다 — 검색 API 가 없어 HTML 파싱에 기대야 하고,
# 그러면 남의 사이트 개편에 제품이 끌려 죽는다.
# 에어갭 설치에서는 이 목록이 오프라인 번들에 담긴 모델 목록이 된다.
#
# est_size_gb 는 크기 게이트에 쓰인다. 대상 노드의 메모리 예산을 넘으면 설치 전에 거부한다 —
# 안 그러면 20GB 를 잘 받아 놓고 실행할 때마다 잡이 죽는다.

models:
  - name: guard-classifier
    provider: ollama
    est_size_gb: 1.2
    purpose: guard
    note: "가드 2단 분류 전용. 구조화 출력 준수율 검증을 통과해야 등록된다"

  - name: demo-small
    provider: mock
    est_size_gb: 4.7
    purpose: general

  - name: demo-medium
    provider: mock
    est_size_gb: 9.0
    purpose: general

  - name: demo-cloud
    provider: mock
    est_size_gb: 0.0
    purpose: general
    note: "클라우드 모델은 설치가 필요 없어 크기 0 이다"
