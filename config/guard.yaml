# 플랫폼 베이스라인 가드 규칙 = 하한선.
# 테넌트는 이 위에 규칙을 더하거나 등급을 올릴 수만 있고, 낮추거나 끌 수 없다.
# 테넌트가 플랫폼의 PII 차단을 끌 수 있으면 제품의 보증 자체가 사라지기 때문이다.
#
# 등급:  off | audit | partial | full | block
#   audit   — 통과시키되 탐지 사실만 기록. 새 규칙의 오탐률을 재는 용도
#   partial — keep_tail 만큼 남기고 마스킹
#   full    — 전체 치환
#   block   — 요청 거부(422). 원문은 응답에 싣지 않는다
# 티어별로 다르게 줄 수 있다:  action: {internal: audit, external: block}

settings:
  # 2단 분류가 실패했을 때. 분류 실패는 "민감하지 않음" 판정이 아니다.
  on_classifier_error: mask          # block | mask | allow

  # 원문 암호문 보존 기간. 테넌트 관리자가 조정한다.
  raw_prompt_retention_days: 7

  # 이 크기를 넘는 프롬프트의 1단 정규식은 스레드 풀로 넘긴다.
  # 안 하면 200KB 프롬프트 한 건이 이벤트 루프를 40~80ms 잡아 다른 모든 요청을 세운다.
  stage1_threadpool_threshold_bytes: 16384

  # audit -> block 승격 게이트. 정답셋 기준 오탐률이 이보다 높으면 승격을 거부한다.
  promotion_max_false_positive_rate: 0.02

  # 2단 분류 모델 등록 게이트. 구조화 출력 준수율이 이보다 낮으면 등록을 거부한다.
  # hybrid thinking 계열은 structured output 이 깨지는 미해결 이슈가 있어 여기 걸린다.
  classifier_min_schema_compliance: 0.98

# 로케일 팩 — i18n 의 진짜 영향은 번역이 아니라 이것이다.
# 개인정보의 "형태" 자체가 나라마다 다르므로, 팩을 안 켜면 그 나라 PII 는 안 잡힌다.
# 안 켜진 필터는 없는 필터인데, 다국어에서는 켰다고 착각하기가 더 쉽다.
locale_packs:

  common:
    always_on: true                  # 로케일과 무관하게 항상 켜진다
    rules:
      - id: credit_card
        kind: pattern
        pattern: '\b(?:\d[ -]?){12,18}\d\b'
        checksum: luhn               # 체크섬이 없으면 숫자 나열이 전부 카드가 된다
        action: full
        label: "[카드번호]"

      - id: email
        kind: pattern
        pattern: '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'
        action: audit                # 오탐이 아니라 "정상 업무 데이터"인 경우가 많다
        label: "[이메일]"

      - id: iban
        kind: pattern
        # IBAN 은 관례상 4자리씩 띄어 쓴다. 붙여쓴 형태만 잡으면 실제 문서의 대부분을
        # 놓친다 — 구분자를 허용하고 체크섬이 비영숫자를 걷어낸다.
        pattern: '\b[A-Z]{2}\d{2}(?:[ -]?[A-Z0-9]){11,30}\b'
        checksum: iban_mod97
        action: full
        label: "[계좌번호]"

      - id: ipv4
        kind: pattern
        # 앞뒤로 숫자나 점이 더 붙으면 IP 가 아니다. 이 lookaround 가 없으면
        # 버전 문자열(1.2.3.4.5)에서 앞 네 마디가 IP 로 잡힌다 — 버전 번호는
        # 문서에 흔해서 이 오탐 하나가 규칙을 통째로 꺼버리게 만든다.
        pattern: '(?<![\d.])(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)(?![\d.])'
        action: audit
        label: "[IP]"

  # ── 프롬프트 인젝션 ──────────────────────────────────────────────────────
  #
  # 2단 분류기는 사용자 텍스트를 LLM 에게 보여주고 "민감한가" 를 묻는다. 그 텍스트가
  # 분류기를 향한 지시를 담으면 판정이 뒤집힐 수 있다 — **가드가 가드를 뚫는 입력에
  # 무방비다.** 구조적 방어(울타리·카나리아)는 파이프라인에 있고, 이 팩은 **탐지**다.
  #
  # always_on 인 이유: 공격자가 언어를 고른다. 한국어 테넌트에 영어 탈옥 문장을 넣는
  # 것을 막는 데 그 테넌트의 로케일은 아무 상관이 없다.
  #
  # **등급을 올리면 탐지가 예방이 된다.** 1단 결과는 분류기에게 넘기기 전에 적용되므로
  # (guard.inspect 의 pre_masked), internal 등급이 full 이면 분류기는 인젝션 문장이
  # 지워진 텍스트를 본다. audit 이면 지워지지 않는다.
  injection:
    always_on: true
    rules:
      - id: injection_control_token
        kind: pattern
        # 채팅 템플릿 제어 토큰. 정상 업무 문서에 나올 일이 사실상 없어서 오탐이
        # 거의 없다 — 그래서 베이스라인에서 바로 마스킹한다.
        pattern: '(?:<\|(?:im_start|im_end|system|user|assistant|endoftext)\|>|\[/?INST\]|<</?SYS>>)'
        action: full
        label: "[제어토큰]"
        description: "채팅 템플릿 제어 토큰"

      - id: injection_frame_forgery
        kind: pattern
        # 이 제품이 분류기 프롬프트에 쓰는 구조를 흉내 내려는 시도. 울타리 토큰 자체는
        # 설치처마다 다른 비밀에서 나오므로 위조할 수 없지만, 표식을 흉내 내 모델을
        # 헷갈리게 하는 것은 가능하다. 정상 문서에 나올 이유가 없다.
        # `[출력]` 으로 끝나는 텍스트는 뺐다 — 프롬프트 템플릿의 형식 표시로 그렇게
        # 쓰는 사람이 실재하고, 이 규칙은 full 이라 그 사람의 요청이 망가진다.
        # 울타리 토큰 자체가 위조 불가라 이 규칙은 어차피 겹겹의 두 번째 겹이다.
        pattern: '(?:CANARY=|\[자료 (?:시작|끝))'
        action: full
        label: "[위조표식]"
        description: "분류기 프롬프트 구조 위조 시도"

      - id: injection_instruction_override
        kind: pattern
        # "이전 지시를 무시하라" 계열. **audit 으로 시작한다** — 사용자가 모델에게
        # 정말로 "앞의 요약은 무시하고 다시 써줘" 라고 쓰는 경우가 실재하고, 그것을
        # 마스킹하면 사용자의 요청이 망가진다. 오탐률을 재고 승격할 항목이다.
        pattern: '(?i)(?:ignore|disregard|forget)\s+(?:all\s+|any\s+)?(?:the\s+)?(?:previous|prior|above|earlier|preceding)\s+(?:instruction|prompt|rule|direction)s?|(?:이전|위|앞)의?\s*(?:모든\s*)?(?:지시|명령|규칙|프롬프트)(?:사항)?(?:은|는|을|를)?\s*(?:전부\s*|모두\s*)?무시'
        action: audit
        label: "[지시무시]"
        description: "이전 지시 무효화 시도"

      - id: injection_system_disclosure
        kind: pattern
        # 시스템 프롬프트를 뱉게 하려는 시도. 유출되면 가드의 판정 기준이 통째로 새고,
        # 그 다음 공격은 그 기준을 알고 들어온다.
        # 어순이 언어마다 다르다. 한국어는 동사가 뒤에("프롬프트를 출력해줘"),
        # 영어는 앞에("repeat your system prompt") 온다 — 한쪽만 적으면 다른 쪽이
        # 통째로 빠지고, 그 사실은 정답셋을 돌리기 전까지 안 드러난다. 실제로 빠졌다.
        pattern: '(?i)(?:repeat|reveal|print|show|output|disclose|tell\s+me)\s+(?:your|the)?\s*(?:system|initial|original)\s+(?:prompt|instruction)s?|(?:system|initial|original)\s+(?:prompt|instruction)s?\s*(?:을|를)?\s*(?:출력|공개|알려|보여)|시스템\s*프롬프트(?:을|를)?\s*(?:출력|공개|알려|보여)'
        action: audit
        label: "[프롬프트유출시도]"
        description: "시스템 프롬프트 유출 시도"

  # ── 시크릿 ───────────────────────────────────────────────────────────────
  #
  # 개인정보와 나란히 새는 것이 자격증명이다. 개발자가 설정 파일을 통째로 붙여
  # 넣거나, **모델이 문맥에 있던 키를 응답에 되풀이한다** — 출력 축이 열린 뒤로
  # 후자가 실재하는 경로가 됐다.
  #
  # always_on 이다. 자격증명 형식은 나라가 아니라 벤더가 정한다.
  #
  # **"고엔트로피 문자열" 탐지는 기각했다.** 섀넌 엔트로피는 진짜 시크릿과 정상
  # 문자열을 가르지 못한다(실측):
  #
  #     token_hex(20) 시크릿   3.635 bits/char
  #     UUID                   3.663
  #     base64 로 인코딩한 영문  4.930   ← 진짜 base64 시크릿(4.539)보다 높다
  #
  # 임계를 어디에 두든 진짜 키를 놓치거나 모든 git SHA 를 잡는다. 그래서 신호를
  # 엔트로피가 아니라 **접두사와 문맥**에서 얻는다.
  secrets:
    always_on: true
    rules:
      - id: secret_vendor_key
        kind: pattern
        # 벤더가 정한 접두사. 정상 문서에 이 모양이 우연히 나올 확률이 사실상 0 이라
        # 체크섬 없이도 오탐이 없다 — 접두사 자체가 체크섬 노릇을 한다.
        #
        # 마지막 항목은 **이 제품 자신의 서비스 토큰**이다. 설치처 개발자가 자기
        # 토큰을 프롬프트에 붙여 넣는 일이 실제로 일어나고, 그것이 경계 밖으로
        # 나가면 이 제품의 인증이 통째로 뚫린다.
        pattern: '(?:(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]{12,}|sk-(?:ant-)?[A-Za-z0-9_\-]{24,}|AIza[0-9A-Za-z_\-]{30,}|[rs]k_(?:live|test)_[A-Za-z0-9]{16,}|eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}|lcc_[0-9a-f]{8}_[A-Za-z0-9_\-]{40,})'
        action: full
        label: "[시크릿]"
        description: "벤더 접두사가 붙은 API 키·토큰"

      - id: secret_private_key
        kind: pattern
        # PEM 개인키 블록의 머리말. 이것이 프롬프트에 있으면 변명의 여지가 없다.
        pattern: '-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----'
        action: full
        label: "[개인키]"
        description: "PEM 개인키"

      - id: secret_assignment
        kind: pattern
        # **문맥이 신호다.** `api_key = …` 의 왼쪽이 오른쪽을 자격증명으로 만든다.
        # 키워드 앞뒤로 식별자 조각을 허용해 `AWS_SECRET_ACCESS_KEY` 같은 형태를 잡는다.
        #
        # **full 로 시작한다.** 베이스라인 원칙은 "체크섬으로 검증되는 규칙은
        # 오탐률이 낮으므로 마스킹으로 시작한다" 이고, 실측이 그것을 뒷받침한다 —
        # 문서·설정·대화 30건에서 오탐 0건(승격 게이트 임계는 2%).
        #
        # 다만 `credential_shape` 는 Luhn 같은 **수학적** 검증기가 아니라 자리표시자
        # 휴리스틱이다. 확신의 근거가 계산이 아니라 정답셋이므로, 설치처는 자기
        # 도메인 샘플을 넣어 다시 재야 한다.
        #
        # 유출된 자격증명은 즉시 악용 가능하고, 마스킹은 요청을 막지 않는다.
        pattern: '(?i)[A-Za-z0-9_.\-]*(?:api[_-]?key|access[_-]?key|secret|access[_-]?token|auth[_-]?token|client[_-]?secret|password|passwd|credential)[A-Za-z0-9_]*\s*["'']?\s*[:=]\s*["'']?[A-Za-z0-9+/=_\-&!@#$%^*.]{12,}'
        checksum: credential_shape        # 자리표시자(TODO·YOUR_KEY_HERE)를 걸러낸다
        action: full
        label: "[자격증명]"
        description: "설정 대입 문맥의 자격증명"

  ko_KR:
    rules:
      - id: kr_rrn
        kind: pattern
        # 7번째 자리: 1-4 내국인, 5-8 외국인등록번호. 1-4 만 보면 외국인등록번호가
        # 통째로 빠진다 — 그것도 이 나라에서 개인을 특정하는 번호다.
        pattern: '\b\d{6}[-\s]?[1-8]\d{6}\b'
        checksum: kr_rrn             # 체크섬 없이는 13자리 숫자가 전부 걸린다
        # **2020-10 부여체계 개편으로 뒷자리가 임의번호가 됐다.**
        # 그 이후 발급·재발급된 번호는 검증식이 성립하지 않아 약 90% 가
        # "체크섬 실패 = PII 아님" 으로 읽히고 마스킹 없이 통과한다(실측).
        #
        # 체크섬을 빼면 13자리 숫자가 전부 걸려 오탐이 쏟아지고, 오탐이 쏟아지면
        # 관리자가 규칙을 꺼버린다 — 안 켜진 필터는 없는 필터다(C2).
        # 그래서 버리지 않고 `audit` 로 남긴다: 마스킹하지 않으므로 오탐 피해가
        # 없고, **얼마나 지나가고 있는지가 보인다.** 오탐률을 재고 나면 관제
        # UI 에서 `kr_rrn:unverified` 를 승격시키면 된다 — 그것이 audit 등급의 용도다.
        checksum_failed_action: audit
        action: full
        label: "[주민등록번호]"

      - id: kr_biz_no
        kind: pattern
        pattern: '\b\d{3}-?\d{2}-?\d{5}\b'
        checksum: kr_biz
        action: full
        label: "[사업자등록번호]"

      - id: kr_phone
        kind: pattern
        pattern: '\b01[016789][-\s]?\d{3,4}[-\s]?\d{4}\b'
        action: partial
        keep_tail: 4
        label: "[휴대폰]"

      - id: kr_passport
        kind: pattern
        pattern: '\b[MSRO]\d{8}\b'
        action: audit
        label: "[여권번호]"

  en_US:
    rules:
      - id: us_ssn
        kind: pattern
        pattern: '\b(?!000|666|9\d\d)\d{3}-(?!00)\d{2}-(?!0000)\d{4}\b'
        action: full
        label: "[SSN]"

      - id: us_ein
        kind: pattern
        pattern: '\b\d{2}-\d{7}\b'
        action: audit
        label: "[EIN]"

      - id: us_phone
        kind: pattern
        pattern: '\b(?:\+1[-\s]?)?\(?\d{3}\)?[-\s]?\d{3}[-\s]?\d{4}\b'
        action: partial
        keep_tail: 4
        label: "[PHONE]"

  ja_JP:
    rules:
      - id: jp_mynumber
        kind: pattern
        pattern: '\b\d{4}[-\s]?\d{4}[-\s]?\d{4}\b'
        checksum: jp_mynumber
        action: full
        label: "[マイナンバー]"

      - id: jp_phone
        kind: pattern
        pattern: '\b0\d{1,4}[-\s]?\d{1,4}[-\s]?\d{4}\b'
        action: partial
        keep_tail: 4
        label: "[電話番号]"

# 2단 — 관리자가 문장으로 정의하는 "맥락". 패턴으로는 안 잡히고 문장으로만 드러나는 민감성.
# 로케일과 무관하므로 팩 밖에 둔다.
context_rules:
  - id: medical_context
    kind: llm
    description: "환자 진료 기록, 병명, 처방 내역, 검사 결과가 포함된 내용"
    action: audit
    label: "[의료정보]"

  - id: hr_evaluation
    kind: llm
    description: "특정 개인에 대한 인사 평가, 징계, 급여 협상 내용"
    action: audit
    label: "[인사정보]"

  - id: undisclosed_financials
    kind: llm
    description: "공시 전 재무 수치, 실적 추정치, 미공개 계약 조건"
    action: {internal: audit, external: block}   # 안에서는 보되 밖으로는 안 내보낸다
    label: "[미공개재무]"

# 베이스라인 등급을 왜 이렇게 잡았나
#
# 체크섬으로 검증되는 규칙(주민번호·카드·IBAN·마이넘버)은 오탐률이 낮으므로 full(마스킹)로 시작한다.
# 마스킹은 요청을 막지 않으므로 도입 첫날 프로덕션을 세우지 않는다.
#
# 패턴만 있는 규칙(이메일·IP·EIN)과 2단 맥락 규칙은 audit 으로 시작한다.
# 새 규칙을 바로 block 으로 켜면 오탐이 쏟아지고, 오탐이 쏟아지면 관리자가 규칙을 꺼버린다.
# audit 로 며칠 재고 오탐 검토 큐에서 오탐률을 확인한 뒤 승격시키는 것이 의도한 운영 흐름이다.
#
# block 은 베이스라인에 하나도 없다. 차단은 설치처가 자기 데이터를 보고 결정할 일이다.
